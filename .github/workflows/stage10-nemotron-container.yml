name: Stage 10 Nemotron container

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nemo-setup
    paths:
      - .github/workflows/stage10-nemotron-container.yml
      - .dockerignore
      - Dockerfile.stage10-nemotron
      - src/stage9/__init__.py
      - src/stage9/resnet18_inference.py
      - src/stage9/reporting.py
      - src/stage9/nemotron_reporting.py
      - src/stage10/__init__.py
      - src/stage10/nemotron_api.py
      - src/stage10/triton_report_adapter.py
      - src/stage10/triton_classifier.py
      - tests/test_stage9_reporting.py
      - tests/test_stage10_nemotron_api.py

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mdsmith44/skin-lesion-ai-stage10-nemotron
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/feature/nemo-setup' }}

      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.stage10-nemotron
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
